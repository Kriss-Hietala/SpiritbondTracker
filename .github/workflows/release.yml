name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Download and install Dalamud distribution
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /home/runner/.xlcore/dalamud/Hooks/dev
        wget -q https://goatcorp.github.io/dalamud-distrib/latest.zip -O /tmp/dalamud.zip
        unzip -q /tmp/dalamud.zip -d /home/runner/.xlcore/dalamud/Hooks/dev

    - name: Restore dependencies
      run: dotnet restore SpiritbondTracker.csproj --source https://api.nuget.org/v3/index.json

    - name: Build Release
      run: dotnet build SpiritbondTracker.csproj -c Release --no-restore

    - name: Create plugin package
      shell: bash
      run: |
        set -euo pipefail

        echo "=== Build output ==="
        find ./bin -type f -print || true

        DLL_PATH="$(find ./bin -type f -name 'SpiritbondTracker.dll' -print -quit)"

        if [ -z "$DLL_PATH" ]; then
          echo "::error::SpiritbondTracker.dll was not found after a successful build."
          exit 1
        fi

        echo "Found plugin DLL: $DLL_PATH"

        mkdir -p ./artifacts/SpiritbondTracker
        cp "$DLL_PATH" ./artifacts/SpiritbondTracker/

        DLL_DIR="$(dirname "$DLL_PATH")"
        find "$DLL_DIR" -maxdepth 1 -type f -name '*.json' -exec cp {} ./artifacts/SpiritbondTracker/ \;

        echo "=== Artifact contents ==="
        find ./artifacts -type f -print

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpiritbondTracker
        path: ./artifacts/
        if-no-files-found: error