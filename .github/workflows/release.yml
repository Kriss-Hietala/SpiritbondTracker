name: Build and Release

on:
  push:
    tags:
      - 'v*' # Skrypt uruchomi się automatycznie, gdy wyślesz na GitHub tag zaczynający się na 'v' (np. v1.0.4.0)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Zmień na wersję .NET, której używasz (np. 9.0 lub 10.0)

      - name: Build project
        run: dotnet build SpiritBondTracker.csproj -c Release

      - name: Create clean publish directory & zip
        run: |
          mkdir -p publish_folder
          
          # Kopiujemy pliki, dbając o dokładne nazwy (case-sensitive)
          # Znajduje plik DLL niezależnie od dokładnej ścieżki netX.0
          find bin/Release -name "SpiritbondTracker.dll" -o -name "SpiritBondTracker.dll" -exec cp {} publish_folder/SpiritbondTracker.dll \;
          cp SpiritbondTracker.json publish_folder/
          cp icon.png publish_folder/
          
          # Tworzymy płaski ZIP (zawierający pliki bezpośrednio w środku, tak jak wymaga Dalamud)
          cd publish_folder
          zip -r ../publish.zip *
          cd ..

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: publish.zip
          latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}