name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Diagnostyka sieciowa - sprawdźmy czy GitHub w ogóle ma dojście do Dalamuda
      - name: Test Dalamud Feed Connectivity
        run: |
          curl -v https://nuget.dalamud.dev/v3/index.json || true

      - name: Build project
        run: dotnet build SpiritbondTracker.csproj -c Release

      - name: Create clean publish directory & zip
        run: |
          mkdir -p publish_folder
          find bin/Release -name "SpiritbondTracker.dll" -o -name "SpiritBondTracker.dll" -exec cp {} publish_folder/SpiritbondTracker.dll \;
          cp SpiritbondTracker.json publish_folder/
          cp icon.png publish_folder/
          
          cd publish_folder
          zip -r ../publish.zip *
          cd ..

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: publish.zip
          latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}