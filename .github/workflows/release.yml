name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare Dalamud SDK Environment
        run: |
          # Tworzymy wymagane katalogi, których szuka Dalamud.NET.Sdk podczas kompilacji w CI
          mkdir -p ~/.xlcore/dalamud/Hooks/dev/
          mkdir -p ~/.xlcore/dalamud/distRibution/
          
          # Pobierем narzędzie pakujące Dalamuda, które często pomaga dopełnić zależności SDK
          dotnet tool install -g Dalamud.Packager || true

      - name: Build project
        run: dotnet build SpiritbondTracker.csproj -c Release

      - name: Create clean publish directory & zip
        run: |
          mkdir -p publish_folder
          find bin/Release -name "SpiritbondTracker.dll" -o -name "SpiritBondTracker.dll" -exec cp {} publish_folder/SpiritbondTracker.dll \;
          cp SpiritbondTracker.json publish_folder/
          cp icon.png publish_folder/
          
          cd publish_folder
          zip -r ../publish.zip *
          cd ..

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: publish.zip
          latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}