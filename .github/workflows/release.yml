name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Download and install Dalamud distribution
      run: |
        # SDK expects Dalamud at this exact path
        mkdir -p /home/runner/.xlcore/dalamud/Hooks/dev
        wget https://goatcorp.github.io/dalamud-distrib/latest.zip -O /tmp/dalamud.zip
        unzip /tmp/dalamud.zip -d /home/runner/.xlcore/dalamud/Hooks/dev
    
    - name: Restore dependencies
      run: dotnet restore SpiritbondTracker.csproj --source https://api.nuget.org/v3/index.json
    
    - name: Build Release
      run: dotnet build SpiritbondTracker.csproj -c Release --no-restore
    
    - name: Create plugin package
      run: |
        # Create plugin ZIP structure manually
        mkdir -p ./artifacts/SpiritbondTracker
        cp ./bin/Release/net10.0/SpiritbondTracker.dll ./artifacts/SpiritbondTracker/
        # Copy json manifest if it exists
        if [ -f ./bin/Release/net10.0/SpiritbondTracker.json ]; then
          cp ./bin/Release/net10.0/SpiritbondTracker.json ./artifacts/SpiritbondTracker/
        fi
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpiritbondTracker
        path: ./artifacts/