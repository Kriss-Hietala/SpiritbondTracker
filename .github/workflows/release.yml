name: Build and release SpiritbondTracker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Auto-bump version based on run number
        shell: bash
        run: |
          set -euo pipefail

          # Generowanie numeru wersji: 1.0.<run_number>.0
          NEW_VERSION="1.0.${{ github.run_number }}.0"
          echo "Bumping version to: $NEW_VERSION"

          # Aktualizacja wersji w SpiritbondTracker.json
          python3 -c "
          import json
          with open('SpiritbondTracker.json', 'r') as f:
              data = json.load(f)
          data['AssemblyVersion'] = '$NEW_VERSION'
          with open('SpiritbondTracker.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

          # Aktualizacja wersji w repo.json
          python3 -c "
          import json
          with open('repo.json', 'r') as f:
              data = json.load(f)
          for plugin in data:
              if plugin.get('InternalName') == 'SpiritbondTracker':
                  plugin['AssemblyVersion'] = '$NEW_VERSION'
          with open('repo.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Install Dalamud files required by SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.xlcore/dalamud/Hooks/dev"
          wget -q "https://goatcorp.github.io/dalamud-distrib/latest.zip" -O /tmp/dalamud.zip
          unzip -q /tmp/dalamud.zip -d "$HOME/.xlcore/dalamud/Hooks/dev"

      - name: Restore dependencies
        run: dotnet restore SpiritbondTracker.csproj --source https://api.nuget.org/v3/index.json

      - name: Build Release
        run: dotnet build SpiritbondTracker.csproj -c Release --no-restore -p:Version="1.0.${{ github.run_number }}.0" -p:AssemblyVersion="1.0.${{ github.run_number }}.0" -p:FileVersion="1.0.${{ github.run_number }}.0"

      - name: Create plugin package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts package
          mkdir -p artifacts package

          DLL_PATH="$(find bin -type f -name 'SpiritbondTracker.dll' -print -quit)"

          if [ -z "$DLL_PATH" ]; then
            echo "::error::Could not find SpiritbondTracker.dll after build."
            find bin -type f -print || true
            exit 1
          fi

          DLL_DIR="$(dirname "$DLL_PATH")"

          cp "$DLL_PATH" package/SpiritbondTracker.dll

          if [ -f "$DLL_DIR/SpiritbondTracker.deps.json" ]; then
            cp "$DLL_DIR/SpiritbondTracker.deps.json" package/
          fi

          cp "SpiritbondTracker.json" package/SpiritbondTracker.json
          [ -f icon.png ] && cp icon.png package/

          cd package
          zip -r ../artifacts/publish.zip .
          cd ..

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v1.0.${{ github.run_number }}.0"

          gh release create "$TAG" \
            artifacts/publish.zip \
            --title "Spiritbond Tracker $TAG" \
            --notes "Automated release $TAG from commit ${{ github.sha }}" \
            --latest

      - name: Commit bumped manifests back to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add SpiritbondTracker.json repo.json
          
          # Sprawdzenie czy są zmiany przed commitem
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-bump version to 1.0.${{ github.run_number }}.0 [skip ci]"
            git push origin main
          fi